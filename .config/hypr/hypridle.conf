general {
    lock_cmd = pidof hyprlock || hyprlock       # Prevent multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # Lock before suspending.
    after_sleep_cmd = hyprctl dispatch dpms on  # Ensure display wakes up properly.
}

listener {
    timeout = 150 # 2.5mins
    on-timeout = brightnessctl -s set 10  # Dim backlight (avoid 0 on OLED).
    on-resume = brightnessctl -r          # Restore brightness.
}

listener {
    timeout = 150 #2.5mins
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0  # Turn off keyboard backlight.
    on-resume = brightnessctl -rd rgb:kbd_backlight         # Restore keyboard backlight.
}

listener {
    timeout = 300 # 5mins
    on-timeout = loginctl lock-session  # Lock screen.
}

listener {
    timeout = 330 # 5.5mins
    on-timeout = hyprctl dispatch dpms off  # Turn off screen.
    on-resume = hyprctl dispatch dpms on    # Turn on screen.
}

listener {
    timeout = 1800 #30mins
    on-timeout = systemctl suspend  # Suspend system.
}
