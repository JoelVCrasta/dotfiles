general {
    lock_cmd = pidof hyprlock || hyprlock       # Prevent multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # Lock before suspending.
    after_sleep_cmd = hyprctl dispatch dpms on  # Ensure display wakes up properly.
}

listener {
    timeout = 150 # 2.5mins
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

listener {
    timeout = 600 # 5mins
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900 # 15mins
    on-timeout = hyprctl dispatch dpms off  # Turn off screen.
    on-resume = hyprctl dispatch dpms on    # Turn on screen.
}

listener {
    timeout = 1200 # 20mins
    on-timeout = systemctl suspend || loginctl suspend
}
