# BACKGROUND
background {
    monitor =
    #path = screenshot
    path = ~/.config/hypr/assets/drink.jpg
    #color = $background
    blur_passes = 2
    contrast = 1
    brightness = 0.7
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# GENERAL
general {
    no_fade_in = true
    no_fade_out = true
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
    ignore_empty_input = true
}

# INPUT FIELD
input-field {
    monitor =
    size = 220, 50
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.35 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.2)
    font_color = rgba(242, 243, 244, 0.75)
    fade_on_empty = false
    rounding = -1
    check_color = rgba(187, 129, 11, 0.75)
    fail_color = rgba(204, 36, 29, 0.75)
    font_family = JetBrainsMono Nerd Font Italic
    placeholder_text = <i><span foreground="##cdd6f4">Password...</span></i>
    hide_input = false
    position = 0, -200
    halign = center
    valign = center
}

# DATE
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A, %B %d")"
  color = rgba(242, 243, 244, 0.75)
  font_size = 22
  font_family = JetBrainsMono Nerd Font
  position = 0, 300
  halign = center
  valign = center
}
# TIME
label {
  monitor = 
  text = cmd[update:1000] echo "$(date +"%-I:%M")"
  color = rgba(242, 243, 244, 0.75)
  font_size = 95
  font_family = JetBrainsMono Nerd Font Bold
  position = 0, 200
  halign = center
  valign = center
}

# CURRENT SONG

image {
    monitor =
    path =
    position = 0, 100
    size = 80
    rotate = 0
    border_size = 0
    rounding = 5
    reload_time = 1
    reload_cmd = ~/.config/hypr/scripts/canvas.sh
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/whatsong.sh)" 
    color = rgba(242, 243, 244, 0.75)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 50
    halign = center
    valign = bottom
}

label {
    monitor =
    text = Hello, Joel Crasta
    color = rgba(242, 243, 244, 0.75)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -140
    halign = center
    valign = center
}


label {
    monitor =
